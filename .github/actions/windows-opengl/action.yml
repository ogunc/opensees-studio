name: "Software OpenGL on Windows"
description: >
  Hosted Windows has no OpenGL driver VTK can use: install Mesa llvmpipe
  system-wide (mesa-dist-win 24.3.0). The off-screen variant stays off, it
  would switch VTK to vtkOSOpenGLRenderWindow, which Qt cannot host. Used by
  the test and gui jobs, so both get the same driver.
runs:
  using: "composite"
  steps:
    - name: Software OpenGL (Mesa llvmpipe) on Windows
      if: runner.os == 'Windows'
      uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79 # v5.1.0
      with:
        pyvista: false
        mesa3d-release: 24.3.0
        install-mesa3d-offscreen: false
