name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mypy is pinned: tools/mypy-budget.txt is an exact error count, and a
      # new mypy release could move it for reasons that are not our code.
      - run: pip install ruff==0.16.8 mypy==2.4.0
      - run: ruff check src tests
      - run: ruff format --check src tests
      # mypy itself runs in the `test` job, where the dependencies are
      # installed: type checking against a bare environment reports a
      # different (meaningless) number of errors.

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.12 everywhere: the Windows opensees.pyd links against
        # python312.dll, so it cannot load on 3.13+.
        python-version: ["3.12"]
        include:
          # Linux/macOS wheels are not tied to one interpreter: check the
          # newer Pythons there.
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-cursor0 libdbus-1-3 libgl1 libxkbcommon0 xvfb
      # Mesa llvmpipe on Windows; the step is shared with the gui job.
      - name: Software OpenGL on Windows
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-opengl
      - run: pip install --retries 5 -e ".[gui,dev]"
      - name: Type check (ratchet)
        # Once, on the reference interpreter: the budget is a single number.
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python tools/typecheck.py
      - name: Layering (import-linter)
        # Views > commands > viewmodels > services > core, plus "core and
        # services stay headless". Needs the dependencies importable, hence
        # this job rather than `lint`.
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: lint-imports
      # No `-m "not slow"` here: the `slow` marker is a developer convenience
      # for the inner loop, and CI skipping tests is how coverage quietly
      # disappears. Everything runs, on every platform.
      - name: Run unit, integration and tools tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          pytest tests/unit tests/integration tests/tools
          --cov --cov-report=xml --cov-report=term-missing
          --cov-fail-under=75
      - name: Keep the coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  gui:
    # The GUI suite runs in one pytest process. For a crash, rerun it one
    # process per file to find the failing file (see CLAUDE.md).
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-cursor0 libdbus-1-3 libgl1 libxkbcommon0 xvfb
      # Mesa llvmpipe on Windows; the step is shared with the test job.
      - name: Software OpenGL on Windows
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-opengl
      - run: pip install --retries 5 -e ".[gui,dev]"
      - name: Run GUI tests, one process (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest tests/gui
      - name: Run GUI tests, one process (Win/Mac)
        if: runner.os != 'Linux'
        run: pytest tests/gui
