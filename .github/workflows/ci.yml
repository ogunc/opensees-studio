name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8 mypy
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-cursor0 libdbus-1-3 libgl1 libxkbcommon0 xvfb
      # Mesa llvmpipe on Windows; the step is shared with the gui job.
      - name: Software OpenGL on Windows
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-opengl
      - run: pip install --retries 5 -e ".[gui,dev]"
      - name: Run unit, integration and tools tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/unit tests/integration tests/tools --cov --cov-report=xml -m "not slow"

  gui:
    # The GUI suite runs in one pytest process. For a crash, rerun it one
    # process per file to find the failing file (see CLAUDE.md).
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4             libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0             libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0             libxcb-cursor0 libdbus-1-3 libgl1 libxkbcommon0 xvfb openbox x11-utils
      # Mesa llvmpipe on Windows; the step is shared with the test job.
      - name: Software OpenGL on Windows
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-opengl
      - run: pip install --retries 5 -e ".[gui,dev]"
      - name: Run GUI tests, one process (Linux, headless)
        if: runner.os == 'Linux'
        env:
          OSV_WINDOW_DIAG: "1"
        # A window manager inside the virtual display lets windows become
        # active, so focus tests run here as on Windows and macOS.
        run: |
          xvfb-run -a bash -c '
            openbox --sm-disable &
            for i in $(seq 50); do
              xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id" && break
              sleep 0.2
            done
            xprop -root _NET_SUPPORTING_WM_CHECK
            pytest tests/gui -m "not slow"
          '
      - name: Run GUI tests, one process (Win/Mac)
        if: runner.os != 'Linux'
        run: pytest tests/gui -m "not slow"
